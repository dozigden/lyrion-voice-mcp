services:
  lyrion-voice-mcp:
    build:
      context: .
      args:
        LVM_VERSION: 0.1.0-dev
        LVM_CHANNEL: development
        LVM_BUILD: compose
        LVM_COMMIT: local
    ports:
      - "5600:5600"
    environment:
      LyrionVoiceMcpLms__ServerId: "${LVM_LMS_SERVER_ID:-}"
      LyrionVoiceMcpLms__BaseUrl: "${LVM_LMS_BASE_URL:-}"
      LyrionVoiceMcpLms__RequestTimeoutSeconds: "${LVM_LMS_REQUEST_TIMEOUT_SECONDS:-5}"
      LyrionVoiceMcpObservations__RetentionDays: "${LVM_SEARCH_RETENTION_DAYS:-90}"
      LyrionVoiceMcpOperations__JobRetentionDays: "${LVM_JOB_RETENTION_DAYS:-90}"
      LyrionVoiceMcpOperations__ErrorRetentionDays: "${LVM_ERROR_RETENTION_DAYS:-90}"
      LyrionVoiceMcpOperations__ToolCallRetentionDays: "${LVM_TOOL_CALL_RETENTION_DAYS:-30}"
      LyrionVoiceMcpOperations__TimeZoneId: "${TZ:-UTC}"
    volumes:
      - application-data:/data
    restart: unless-stopped

volumes:
  application-data:
