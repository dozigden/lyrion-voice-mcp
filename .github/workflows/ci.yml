name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licences:
    name: Licence disclosure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: LyrionVoiceMcp.Web/package-lock.json
      - name: Restore API runtime graph
        run: dotnet restore LyrionVoiceMcp.Api/LyrionVoiceMcp.Api.csproj --locked-mode -maxcpucount:1 -nodeReuse:false
      - name: Install frontend dependencies
        working-directory: LyrionVoiceMcp.Web
        run: npm ci --ignore-scripts
      - name: Verify licence disclosure
        working-directory: LyrionVoiceMcp.Web
        run: |
          npm run sync:third-party-licences -- --strict
          if [ -n "$(git status --porcelain -- compliance/third-party-licenses public/third-party-licenses)" ]; then
            echo "Licence disclosure files are out of date. Run: npm run sync:third-party-licences"
            git status --short -- compliance/third-party-licenses public/third-party-licenses
            exit 1
          fi

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - name: Validate backend
        run: node scripts/run-tests.mjs --backend-only

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: LyrionVoiceMcp.Web/package-lock.json
      - name: Install dependencies
        working-directory: LyrionVoiceMcp.Web
        run: npm ci --ignore-scripts
      - name: Validate frontend
        run: node scripts/run-tests.mjs --web-only

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: LyrionVoiceMcp.Web/package-lock.json
      - name: Block high and critical npm vulnerabilities
        working-directory: LyrionVoiceMcp.Web
        run: npm audit --audit-level=high --package-lock-only
      - name: Validate container promotion inputs
        run: |
          set -euo pipefail
          digest_directory="$RUNNER_TEMP/promotion-digests"
          mkdir -p "$digest_directory"
          touch "$digest_directory/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          touch "$digest_directory/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          metadata='{"tags":["ghcr.io/example/lyrion-voice-mcp:test","example/lyrion-voice-mcp:test"]}'
          ./scripts/promote-container-digests.sh \
            "$digest_directory" "$metadata" \
            ghcr.io/example/lyrion-voice-mcp example/lyrion-voice-mcp \
            --dry-run

  image:
    name: Image (${{ matrix.platform }})
    needs:
      - licences
      - backend
      - frontend
      - supply-chain
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: lyrion-voice-mcp:ci-${{ matrix.architecture }}
          build-args: |
            LVM_VERSION=0.1.0
            LVM_CHANNEL=ci
            LVM_BUILD=github-${{ github.run_number }}
            LVM_COMMIT=${{ github.sha }}
      - name: Smoke-test native image
        run: ./scripts/smoke-container.sh lyrion-voice-mcp:ci-${{ matrix.architecture }} ${{ matrix.architecture }}
