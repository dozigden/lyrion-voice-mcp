name: Publish Docker Image on Tag Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: container-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      build: ${{ steps.release_meta.outputs.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: release_meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ "$VERSION" = "$TAG" ] || [ -z "$VERSION" ]; then
            echo "Expected tag format v<version>, got: ${TAG}"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected SemVer tag format vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD], got: ${TAG}"
            exit 1
          fi

          REPO_VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props || true)"
          if [ -z "$REPO_VERSION" ]; then
            echo "Failed to resolve <Version> from Directory.Build.props"
            exit 1
          fi

          if [ "$REPO_VERSION" != "$VERSION" ]; then
            echo "Tag version (${VERSION}) does not match Directory.Build.props version (${REPO_VERSION})."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=tag-${VERSION}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Tagged SHA
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-platform:
    name: Stage and Smoke Test (${{ matrix.platform }})
    needs:
      - preflight
      - validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compute image name
        id: image
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          REPO_NAME_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_NAME_LOWER="${REPO_NAME_LOWER,,}"
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}"
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_NAME_LOWER}"

          echo "ghcr_name=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_name=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.image.outputs.ghcr_name }}
            ${{ steps.image.outputs.dockerhub_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and stage platform image by digest
        id: release
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,"name=${{ steps.image.outputs.ghcr_name }},${{ steps.image.outputs.dockerhub_name }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            LVM_VERSION=${{ needs.preflight.outputs.version }}
            LVM_CHANNEL=release
            LVM_BUILD=${{ needs.preflight.outputs.build }}
            LVM_COMMIT=${{ github.sha }}

      - name: Smoke-test exact staged digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.image.outputs.dockerhub_name }}
          EXPECTED_BUILD: ${{ needs.preflight.outputs.build }}
          EXPECTED_CHANNEL: release
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr_name }}
          PLATFORM_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            exact_image="$image@$PLATFORM_DIGEST"
            docker pull "$exact_image"
            ./scripts/smoke-container.sh "$exact_image" ${{ matrix.architecture }}
          done

      - name: Clear registry credentials
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout docker.io || true

      - name: Export platform digest
        run: |
          mkdir -p "$RUNNER_TEMP/release-digests"
          digest="${{ steps.release.outputs.digest }}"
          touch "$RUNNER_TEMP/release-digests/${digest#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/release-digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Multi-Architecture Release Manifests
    needs:
      - preflight
      - validate
      - build-platform
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compute image name
        id: image
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          REPO_NAME_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_NAME_LOWER="${REPO_NAME_LOWER,,}"
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}"
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_NAME_LOWER}"

          echo "ghcr_name=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_name=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.image.outputs.ghcr_name }}
            ${{ steps.image.outputs.dockerhub_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-digests-*
          path: ${{ runner.temp }}/release-digests
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote validated release digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.image.outputs.dockerhub_name }}
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr_name }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: ./scripts/promote-container-digests.sh "$RUNNER_TEMP/release-digests" "$METADATA_JSON" "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"

      - name: Clear registry credentials
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout docker.io || true
