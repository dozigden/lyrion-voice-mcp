name: Publish Nightly Docker Image

on:
  schedule:
    - cron: "45 22 * * *"
      timezone: "Europe/London"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force a nightly publish even if no commits changed since last nightly"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: container-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Nightly Build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      current_sha: ${{ steps.changes.outputs.current_sha }}
      short_sha: ${{ steps.changes.outputs.short_sha }}
      should_build: ${{ steps.changes.outputs.should_build }}
      version: ${{ steps.app_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve app version
        id: app_version
        run: |
          VERSION="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props || true)"
          if [ -z "$VERSION" ]; then
            echo "Failed to resolve <Version> from Directory.Build.props"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Detect changes since last nightly build
        id: changes
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          LAST_SHA="$(git rev-list -n 1 refs/tags/nightly-last-build 2>/dev/null || true)"
          FORCE_REBUILD="${{ github.event.inputs.force_rebuild || 'false' }}"

          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "Manual force rebuild requested. Publishing nightly image for ${CURRENT_SHA}."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "No changes since last nightly build (${CURRENT_SHA}). Skipping publish."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$LAST_SHA" ]; then
              echo "No previous nightly marker found. Publishing nightly image."
            else
              echo "Detected changes since last nightly build (${LAST_SHA} -> ${CURRENT_SHA})."
            fi
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate Nightly SHA
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-platform:
    name: Stage and Smoke Test (${{ matrix.platform }})
    needs:
      - prepare
      - validate
    if: needs.prepare.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image name
        id: image
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          REPO_NAME_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_NAME_LOWER="${REPO_NAME_LOWER,,}"
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}"
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_NAME_LOWER}"

          echo "ghcr_name=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_name=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.image.outputs.ghcr_name }}
            ${{ steps.image.outputs.dockerhub_name }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.prepare.outputs.short_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and stage platform image by digest
        id: nightly
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,"name=${{ steps.image.outputs.ghcr_name }},${{ steps.image.outputs.dockerhub_name }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            LVM_VERSION=${{ needs.prepare.outputs.version }}
            LVM_CHANNEL=nightly
            LVM_BUILD=nightly-${{ needs.prepare.outputs.short_sha }}
            LVM_COMMIT=${{ needs.prepare.outputs.current_sha }}

      - name: Smoke-test exact staged digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.image.outputs.dockerhub_name }}
          EXPECTED_BUILD: nightly-${{ needs.prepare.outputs.short_sha }}
          EXPECTED_CHANNEL: nightly
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.current_sha }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr_name }}
          PLATFORM_DIGEST: ${{ steps.nightly.outputs.digest }}
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            exact_image="$image@$PLATFORM_DIGEST"
            docker pull "$exact_image"
            ./scripts/smoke-container.sh "$exact_image" ${{ matrix.architecture }}
          done

      - name: Clear registry credentials
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout docker.io || true

      - name: Export platform digest
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-digests"
          digest="${{ steps.nightly.outputs.digest }}"
          touch "$RUNNER_TEMP/nightly-digests/${digest#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/nightly-digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Multi-Architecture Nightly Manifests
    needs:
      - prepare
      - validate
      - build-platform
    if: needs.prepare.outputs.should_build == 'true'
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute image name
        id: image
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          REPO_NAME_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_NAME_LOWER="${REPO_NAME_LOWER,,}"
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}"
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_NAME_LOWER}"

          echo "ghcr_name=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_name=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.image.outputs.ghcr_name }}
            ${{ steps.image.outputs.dockerhub_name }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.prepare.outputs.short_sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: nightly-digests-*
          path: ${{ runner.temp }}/nightly-digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote validated nightly digests
        env:
          DOCKERHUB_IMAGE: ${{ steps.image.outputs.dockerhub_name }}
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr_name }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: ./scripts/promote-container-digests.sh "$RUNNER_TEMP/nightly-digests" "$METADATA_JSON" "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"

      - name: Clear registry credentials
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout docker.io || true

      - name: Update nightly build marker tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f nightly-last-build "${{ needs.prepare.outputs.current_sha }}"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            push origin refs/tags/nightly-last-build --force
